[package]
name = "tauri-plugin-otel"
version = "0.1.1" # x-release-please-version
description = "OpenTelemetry for Tauri v2: OTLP/HTTP traces and logs from Rust and the webview, one resource, one export floor."
authors = ["Vaam <oss@vaam.app>"]
license = "MIT"
edition = "2021"
# Measured, not chosen: `cargo +1.88 check --all-targets` passes and 1.85
# does not, because Tauri's own dependency tree (`time`, `plist`,
# `serde_with`) now asks for 1.88.
rust-version = "1.88"
repository = "https://github.com/vaam-apps/tauri-otel"
keywords = ["tauri", "tauri-plugin", "opentelemetry", "otlp", "tracing"]
categories = ["development-tools::debugging", "gui"]
exclude = ["/dist-js", "/guest-js", "/node_modules", "/docs"]
links = "tauri-plugin-otel"

[dependencies]
tauri = { version = "2.11" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1.44"
tracing-core = "0.1.36"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "registry"] }
opentelemetry = { version = "0.33", features = ["trace", "logs"] }
opentelemetry_sdk = { version = "0.33", features = ["trace", "logs"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "logs", "gzip-http"] }
opentelemetry-semantic-conventions = { version = "0.33", features = ["semconv_experimental"] }
tracing-opentelemetry = { version = "0.34", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
os_info = { version = "3", default-features = false }
getrandom = "0.3"

[build-dependencies]
tauri-plugin = { version = "2.6", features = ["build"] }

[dev-dependencies]
tauri = { version = "2.11", features = ["test"] }
opentelemetry_sdk = { version = "0.33", features = ["trace", "logs", "testing"] }
# The end-to-end test decodes what actually arrived on the wire.
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "trace", "logs"] }
prost = "0.14"
flate2 = "1"
# Resolves the real `permissions/` against a capability, so the end-to-end
# test goes through the same ACL an app does.
tauri-utils = { version = "2", features = ["build"] }
toml = "0.9"
