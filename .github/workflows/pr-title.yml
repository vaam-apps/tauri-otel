name: pr-title

# The pull request title must be a conventional commit.
#
# Not a style rule. This repository squash-merges, so the PR title becomes
# the subject of the one commit that lands on `main`, and that subject is
# the ONLY thing `release-please.yml` reads to decide whether there is a
# release to propose and whether it is a patch, a minor or a major. A title
# of "Fix the breadcrumbs" is invisible to it; "fix: stop resending a
# spent breadcrumb trail" is a patch.
#
# This is deliberately a separate workflow rather than a job in `quality.yml`.
# A PR title is changed by editing it, which raises `edited` and not
# `synchronize`; `quality.yml` does not listen for `edited`, and adding it
# there would re-run the whole gated build every time somebody fixes a typo
# in a title.
#
# Implemented as a regex rather than a marketplace action on purpose, per
# vaam-apps/.github's own release guide (docs/releasing.md): an unpinned
# moving dependency inside a release pipeline is a real future-breakage
# risk, and the whole rule is one regex.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  # `commit-message-parses` lists the pull request's commits via the REST API.
  pull-requests: read

jobs:
  conventional-title:
    name: title is a conventional commit
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          # Via the environment, never interpolated into the script body: a
          # PR title is attacker-controlled text and `${{ }}` inside a
          # `run:` is textual substitution, so a title containing a quote
          # and a semicolon would execute.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # type(optional scope)optional-!: subject
          #
          # The type list is exactly the one `release-please-config.json`
          # declares changelog sections for. `feat` and `fix` move the
          # version; `!` (or a `BREAKING CHANGE:` footer in the body) makes
          # it a major. Everything else still produces a release, as a
          # patch.
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9,._/ -]+\))?!?: .+'

          if printf '%s' "$TITLE" | grep -qE "$PATTERN"; then
            echo "OK — $TITLE"
            exit 0
          fi

          {
            echo "### Pull request title is not a conventional commit"
            echo
            echo '```'
            echo "$TITLE"
            echo '```'
            echo
            echo "It must start with one of \`feat\` \`fix\` \`docs\` \`style\`"
            echo "\`refactor\` \`perf\` \`test\` \`build\` \`ci\` \`chore\` \`revert\`,"
            echo "an optional \`(scope)\`, an optional \`!\` for a breaking change,"
            echo "then \`: \` and a subject. For example:"
            echo
            echo '```'
            echo "fix: keep the page's span ids when re-exporting"
            echo "feat(guest): trace fetch calls as well as invoke"
            echo "refactor!: the log command takes one record per call"
            echo '```'
            echo
            echo "This repository squash-merges, so this title is the commit"
            echo "subject on \`main\`, and it is the only thing release-please"
            echo "reads to decide the next version. Edit the title and this"
            echo "check re-runs on its own."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error title=Non-conventional PR title::${TITLE}"
          exit 1

  # The title is only line 1 of what lands. This job checks the WHOLE squash
  # message with release-please's own parser, because a body line can make
  # release-please discard the entire commit — silently, with the workflow
  # green. See ci/commit-message-parse/parse.mjs, and vaam-apps/.github's
  # docs/releasing.md, for the incident and the exact grammar rule.
  #
  # It lives in `pr-title.yml` rather than its own file because it shares
  # this trigger exactly: `edited` (the title changed) and `synchronize`
  # (the commits changed) are both inputs to the assembled message, and
  # `quality.yml` still must not listen for `edited`.
  commit-message-parses:
    name: the squash message parses as a conventional commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'

      # A standalone npm project with a committed lockfile and an exact pin,
      # deliberately outside any pub/pnpm workspace — it is a CI tool, not
      # plugin code. The pin is `@conventional-commits/parser` 0.4.1, the
      # only version satisfying release-please 17.6.0's own `^0.4.1`, so
      # this guard parses with exactly the grammar release-please will use.
      # A looser range here would let the two disagree, which is the one
      # way this check could report a verdict that does not match reality.
      - name: Install the parser
        working-directory: ci/commit-message-parse
        run: npm ci

      - name: Parse the message this pull request would land
        working-directory: ci/commit-message-parse
        env:
          # Via the environment, never `${{ }}` inside `run:` — a pull
          # request title is attacker-controlled text and `${{ }}` in a
          # `run:` body is textual substitution.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node parse.mjs
